dependencies = [
    "alembic==1.16.4",
    "annoy==1.17.3",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "cachetools==6.2.2",
    "email-validator==2.2.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "huggingface-hub==0.34.4",
    "jwt==1.4.0",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.10.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "python-dotenv==1.1.1",
    "python-jose==3.5.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.41",
    "streamlit==1.51.0",
    "uvicorn==0.35.0",
