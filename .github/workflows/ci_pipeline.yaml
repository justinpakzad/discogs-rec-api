name: discogs-rec-api test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Python setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Ruff
      run: pip install ruff
    
    - name: Ruff linting
      run: ruff check . --exclude migrations
     
  run_tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup testing
      run: docker compose run --rm setup python setup_scripts/main.py --ci

    - name: Run tests
      run: docker compose up --build --abort-on-container-exit tests

    - name: Cleanup
      if: always()
      run: docker compose down -v

    
