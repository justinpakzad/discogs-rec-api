name: discogs-rec-api test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: "Set up Python"
      uses: actions/setup-python@v6
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
  
    - name: Install dependencies
      run: uv sync --locked --only-dev
    
    - name: Ruff linting
      run: uv run --no-sync ruff check . --exclude migrations
     
  run_tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup testing
      run: docker compose run --rm setup python setup_scripts/main.py --ci

    - name: Run tests
      run: docker compose up --build --abort-on-container-exit tests

    - name: Cleanup
      if: always()
      run: docker compose down -v

    
